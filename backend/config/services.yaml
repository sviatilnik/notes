services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/'
            - '../src/Kernel.php'
            - '../src/UI/Http/Request/'

    App\Domain\Note\Repository\NoteRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineNoteRepository

    App\Application\Note\ReadModel\NoteListReader:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineNoteListReader
