framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    serializer:
        enabled: true
        default_context:
            json_encode_options: 320
    validation:
        email_validation_mode: html5
    router:
        utf8: true
    session: false

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
