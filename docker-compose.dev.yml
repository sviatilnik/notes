name: notes-dev

services:
  php:
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: notes-dev-secret
      DATABASE_URL: sqlite:///%kernel.project_dir%/var/data/notes.db
    volumes:
      - ./backend:/var/www/html
      - notes_dev_data:/var/www/html/var/data
      - notes_dev_vendor:/var/www/html/vendor
    networks:
      - notes
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_PROXY: http://php:8000
      VITE_HMR_CLIENT_PORT: "8080"
    ports:
      - "8080:5173"
    volumes:
      - ./frontend:/app
      - notes_dev_node_modules:/app/node_modules
    depends_on:
      - php
    networks:
      - notes
    restart: unless-stopped

volumes:
  notes_dev_data:
  notes_dev_vendor:
  notes_dev_node_modules:

networks:
  notes:
    driver: bridge
